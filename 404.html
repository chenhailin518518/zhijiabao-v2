<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面不存在 - 智价宝</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 20% 20%, #f6f3ec, #e8e2d6 60%, #ddd5c6);
      color: #2f3d3a; padding: 24px;
    }
    .card {
      max-width: 560px; width: 100%; background: rgba(255,255,255,0.82); border: 1px solid rgba(47,61,58,0.12);
      border-radius: 24px; padding: 40px 32px; box-shadow: 0 24px 60px rgba(47,61,58,0.16); text-align: center;
    }
    .mark { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 20px; display: grid; place-items: center;
      background: linear-gradient(135deg, #4f827a, #2f3d3a); color: #f6f3ec; font-size: 30px; font-weight: 700; }
    h1 { font-size: 26px; margin: 0 0 10px; }
    p { color: #5d6b68; line-height: 1.7; margin: 0 0 22px; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    a {
      display: inline-flex; align-items: center; padding: 10px 18px; border-radius: 999px; text-decoration: none;
      background: #2f3d3a; color: #f6f3ec; font-size: 14px;
    }
    a.ghost { background: transparent; border: 1px solid rgba(47,61,58,0.28); color: #2f3d3a; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">智</div>
    <h1>这个页面走丢了</h1>
    <p>你访问的地址不存在或已经下架。可以回到首页，或去二手集市与 AI 估价看看。</p>
    <div class="links">
      <a id="homeLink" href="./">返回首页</a>
      <a id="marketLink" class="ghost" href="./market/">逛二手集市</a>
      <a id="estimateLink" class="ghost" href="./estimate/">去 AI 估价</a>
    </div>
  </main>
  <script>
    /* GitHub Pages 项目站点会在任意未知路径返回本页，这里修正相对路径前缀 */
    (function () {
      var isPages = location.hostname.endsWith("github.io");
      var base = isPages ? "/zhijiabao-demo/" : "./";
      document.getElementById("homeLink").href = base;
      document.getElementById("marketLink").href = base + "market/";
      document.getElementById("estimateLink").href = base + "estimate/";
    })();
  </script>
</body>
</html>
