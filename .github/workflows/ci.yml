name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 单元 / 静态 / 接口 / 页面 DOM
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zhijiabao
          MYSQL_USER: zhijiabao
          MYSQL_PASSWORD: zhijiabao
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: zhijiabao
      MYSQL_PASSWORD: zhijiabao
      MYSQL_DATABASE: zhijiabao
      MYSQL_DATABASE_TEST: zhijiabao_test

    steps:
      - uses: actions/checkout@v4

      - name: 准备 Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 准备测试数据库（接口测试使用独立库，避免污染演示数据）
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "
            CREATE DATABASE IF NOT EXISTS zhijiabao_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
            GRANT ALL PRIVILEGES ON zhijiabao_test.* TO 'zhijiabao'@'%';
            FLUSH PRIVILEGES;"

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 纯逻辑单元测试
        run: npm run test:unit

      - name: 静态资源与结构检查
        run: npm run test:smoke

      - name: 数据库初始化自检（建表 + 种子数据）
        run: npm run db:init

      - name: 后端接口集成测试
        run: npm run test:api

      - name: 页面 DOM 冒烟测试
        run: npm run test:dom

      - name: 校验镜像页与外壳页保持同步
        run: |
          npm run mirror
          git diff --exit-code -- '*/index.html' || (echo "::error::镜像页未同步，请本地执行 npm run mirror 后提交" && exit 1)
